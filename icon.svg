<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="tempGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="60%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e74c3c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- CPU Pins (Top, Bottom, Left, Right) -->
  <g fill="#cbd5e0" opacity="0.85">
    <!-- Top Pins -->
    <rect x="28" y="10" width="6" height="8" rx="2"/>
    <rect x="42" y="10" width="6" height="8" rx="2"/>
    <rect x="56" y="10" width="6" height="8" rx="2"/>
    <rect x="70" y="10" width="6" height="8" rx="2"/>
    <rect x="84" y="10" width="6" height="8" rx="2"/>
    <rect x="98" y="10" width="6" height="8" rx="2"/>
    <!-- Bottom Pins -->
    <rect x="28" y="110" width="6" height="8" rx="2"/>
    <rect x="42" y="110" width="6" height="8" rx="2"/>
    <rect x="56" y="110" width="6" height="8" rx="2"/>
    <rect x="70" y="110" width="6" height="8" rx="2"/>
    <rect x="84" y="110" width="6" height="8" rx="2"/>
    <rect x="98" y="110" width="6" height="8" rx="2"/>
    <!-- Left Pins -->
    <rect x="10" y="28" width="8" height="6" rx="2"/>
    <rect x="10" y="42" width="8" height="6" rx="2"/>
    <rect x="10" y="56" width="8" height="6" rx="2"/>
    <rect x="10" y="70" width="8" height="6" rx="2"/>
    <rect x="10" y="84" width="8" height="6" rx="2"/>
    <rect x="10" y="98" width="8" height="6" rx="2"/>
    <!-- Right Pins -->
    <rect x="110" y="28" width="8" height="6" rx="2"/>
    <rect x="110" y="42" width="8" height="6" rx="2"/>
    <rect x="110" y="56" width="8" height="6" rx="2"/>
    <rect x="110" y="70" width="8" height="6" rx="2"/>
    <rect x="110" y="84" width="8" height="6" rx="2"/>
    <rect x="110" y="98" width="8" height="6" rx="2"/>
  </g>

  <!-- CPU Substrate Body -->
  <rect x="16" y="16" width="96" height="96" rx="14" fill="url(#chipGrad)" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Corner notch -->
  <circle cx="26" cy="26" r="3.5" fill="#a0aec0" opacity="0.6"/>

  <!-- CPU Heat Spreader / Core Center -->
  <rect x="28" y="28" width="72" height="72" rx="10" fill="url(#coreGrad)" stroke="#718096" stroke-width="1.5"/>

  <!-- Thermometer Body -->
  <!-- Bulb -->
  <circle cx="64" cy="80" r="14" fill="#2d3748" stroke="#e2e8f0" stroke-width="3"/>
  <!-- Stem -->
  <rect x="58" y="36" width="12" height="40" rx="6" fill="#2d3748" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="59.5" y="45" width="9" height="30" fill="#2d3748"/>

  <!-- Mercury Fluid (Gradient) -->
  <circle cx="64" cy="80" r="10" fill="url(#tempGrad)"/>
  <rect x="60.5" y="46" width="7" height="30" rx="3.5" fill="url(#tempGrad)"/>

  <!-- Tick Marks -->
  <line x1="72" y1="46" x2="77" y2="46" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="54" x2="76" y2="54" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="62" x2="77" y2="62" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>

  <!-- Celcius symbol -->
  <text x="86" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38ef7d">°C</text>
</svg>
